[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocad-mcp-server-macos"
version = "0.2.0"
description = "MCP server that generates AutoCAD-compatible DXF drawings on macOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ezdxf>=1.3.5",
    "mcp[cli]>=1.4.1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.12.0"]
test = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["server", "dxf_backend", "autocad_manager", "db_manager", "main"]
